<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URL Shortener</title><style>body{font-family:Inter,system-ui,sans-serif;max-width:900px;margin:50px auto;padding:0 20px;background:#f7f7f8;color:#171717}main{background:white;border:1px solid #ddd;border-radius:18px;padding:32px;box-shadow:0 8px 30px #0000000d}h1{margin-top:0}.row{display:flex;gap:10px}input{flex:1;padding:14px;border:1px solid #ccc;border-radius:10px;font-size:16px}button{padding:12px 18px;border:0;border-radius:10px;background:#111;color:white;cursor:pointer}.result{margin-top:20px;padding:15px;background:#f1f1f1;border-radius:10px;display:none}.recent{margin-top:30px}.item{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid #eee}.muted{color:#666;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.small{font-size:13px;color:#777}@media(max-width:600px){.row{flex-direction:column}.item{flex-direction:column}}</style></head><body><main><h1>URL Shortener</h1><p class="muted">Create a short, shareable URL and see it redirect in real time.</p><div class="row"><input id="url" placeholder="https://example.com/your-long-url"><button onclick="shorten()">Shorten</button></div><div id="result" class="result"></div><section class="recent"><h2>Recent Short URLs</h2><div id="list" class="small">Loading…</div></section></main><script>
async function shorten(){const input=document.getElementById('url'),r=document.getElementById('result');try{const res=await fetch('/api/urls',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:input.value})});const d=await res.json();if(!res.ok)throw Error(d.error||'Invalid URL');const full=location.origin+d.shortUrl;r.style.display='block';r.innerHTML=`Created: <a href="${d.shortUrl}">${full}</a> <button onclick="navigator.clipboard.writeText('${full}')">Copy</button>`;input.value='';loadRecent()}catch(e){r.style.display='block';r.textContent=e.message}}
async function loadRecent(){const res=await fetch('/api/urls/recent');const data=await res.json();document.getElementById('list').innerHTML=data.length?data.map(x=>`<div class="item"><div><a href="/${x.shortCode}">${location.origin}/${x.shortCode}</a><div class="muted">${escapeHtml(x.originalUrl)}</div></div><div>${x.clickCount} clicks · <a href="/api/urls/${x.shortCode}/analytics">analytics</a></div></div>`).join(''):'No URLs yet — create the first one above.'}
function escapeHtml(s){return s.replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}loadRecent();
</script></body></html>
